<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thiago Maués · Front-end e UI</title>
    <meta
      name="description"
      content="Front-end e UI design. Faço interfaces em React e Vue, do layout ao deploy. Procurando estágio ou vaga júnior."
    />
    <meta property="og:title" content="Thiago Maués · Front-end e UI" />

      property="og:description"
      content="Projetos, experiência e contato do Thiago Maués, desenvolvedor front-end."
    />

    <meta name="theme-color" content="#111212" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Aplica tema e idioma salvos antes da primeira pintura, evitando o flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
